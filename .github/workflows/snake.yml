name: GitHub Snake Game (2026 Only)

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout your repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Generate Pokemon Snake Animation
      - name: Generate Pokemon Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: DhanushPillay
          outputs: |
            dist/github-snake.svg?color_snake=#ffcb05&color_dots=#ebedf0,#ffcccc,#ff9999,#ff6666,#cc0000
            dist/github-snake-dark.svg?color_snake=#ffcb05&color_dots=#161b22,#ffcccc,#ff9999,#ff6666,#cc0000

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Deploy files to output branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update Pokemon snake animation [skip ci]"

