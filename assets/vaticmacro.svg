<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Animated Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#2DD4BF;#38BDF8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#21262D" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #FFFFFF;
    }
    .badge-tag {
      font-family: "JetBrains Mono", "Fira Code", monospace, sans-serif;
      font-weight: 600;
      font-size: 10px;
      fill: #38BDF8;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      fill: #8B949E;
      line-height: 18px;
    }
    .chip {
      fill: #21262D;
      stroke: #30363D;
      stroke-width: 1;
      rx: 4;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 10.5px;
      fill: #C9D1D9;
    }
    .cta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #38BDF8;
    }
  </style>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="406" height="236" rx="12" fill="url(#borderGrad)" />
  <rect x="3" y="3" width="404" height="234" rx="11" fill="url(#bgGrad)" />

  <g transform="translate(20, 20)">
    <!-- Header Row: Icon + Title + Type Badge -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#1C2128" stroke="#30363D" stroke-width="1" />
    <!-- Chart / Macro Icon -->
    <path d="M8 26 L14 18 L20 22 L28 10" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="10" r="2.5" fill="#38BDF8" />

    <text x="46" y="16" class="title">VaticMacro</text>
    <rect x="46" y="22" width="132" height="16" rx="4" fill="#0E2333" stroke="#1D4363" stroke-width="0.8" />
    <text x="52" y="34" class="badge-tag">MACRO FORECASTING</text>

    <!-- Description -->
    <text x="0" y="65" class="desc">
      <tspan x="0" dy="0">Production ML framework analyzing Indian inflation indicators</tspan>
      <tspan x="0" dy="19">(CPI, WPI, GDP, RBI rates, USD/INR, Brent Crude) with</tspan>
      <tspan x="0" dy="19">ensemble predictive models and containerized APIs.</tspan>
    </text>

    <!-- Tech Chips -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="58" height="22" class="chip" />
      <text x="8" y="15" class="chip-text">Python</text>

      <rect x="66" y="0" width="68" height="22" class="chip" />
      <text x="74" y="15" class="chip-text">XGBoost</text>

      <rect x="142" y="0" width="82" height="22" class="chip" />
      <text x="150" y="15" class="chip-text">Scikit-Learn</text>

      <rect x="232" y="0" width="50" height="22" class="chip" />
      <text x="240" y="15" class="chip-text">Flask</text>

      <rect x="290" y="0" width="58" height="22" class="chip" />
      <text x="298" y="15" class="chip-text">Docker</text>
    </g>

    <!-- Footer Action -->
    <g transform="translate(0, 175)">
      <line x1="0" y1="0" x2="370" y2="0" stroke="#21262D" stroke-width="1" />
      <text x="0" y="18" class="cta-text">View Repository &amp; Architecture →</text>
    </g>
  </g>
</svg>
