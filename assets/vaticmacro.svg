<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes cpiPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cpi-pulse { animation: none !important; opacity: 1; }
    }
  </style>

  <!-- Canvas -->
  <rect width="850" height="200" rx="8" fill="url(#vmBg)"/>
  <rect x="0.5" y="0.5" width="849" height="199" rx="8" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Left: Scrolling Predictions Feed -->
  <g transform="translate(32, 24)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#475569" letter-spacing="0.8">LATEST PREDICTIONS</text>
    <line x1="0" y1="22" x2="260" y2="22" stroke="#1E293B" stroke-width="0.5"/>

    <!-- Clip Window -->
    <clipPath id="vmFeedClip">
      <rect x="0" y="24" width="280" height="145"/>
    </clipPath>
    
    <g clip-path="url(#vmFeedClip)">
      <g>
        <!-- 5 items × 60px = 300px total height per set -->
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-300" dur="20s" repeatCount="indefinite" />
        
        <!-- === SET 1 === -->
        <g transform="translate(0, 42)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">CPI INFLATION</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#F43F5E">▲ 4.45%</text>
          <text x="110" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">YoY (July)</text>
        </g>
        
        <g transform="translate(0, 102)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">WPI INFLATION</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#34D399">▼ 9.78%</text>
          <text x="110" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">YoY (July)</text>
        </g>
        
        <g transform="translate(0, 162)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">RBI REPO RATE</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#F59E0B">5.25%</text>
          <text x="85" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">maintained</text>
        </g>
        
        <g transform="translate(0, 222)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">GDP GROWTH</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#34D399">▲ 6.70%</text>
          <text x="110" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">FY27 proj</text>
        </g>

        <g transform="translate(0, 282)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">USD / INR</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#38BDF8">95.66</text>
          <text x="85" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">spot rate</text>
        </g>

        <!-- === SET 2 (Duplicate for seamless loop) === -->
        <g transform="translate(0, 342)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">CPI INFLATION</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#F43F5E">▲ 4.45%</text>
          <text x="110" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">YoY (July)</text>
        </g>
        
        <g transform="translate(0, 402)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">WPI INFLATION</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#34D399">▼ 9.78%</text>
          <text x="110" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">YoY (July)</text>
        </g>
        
        <g transform="translate(0, 462)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">RBI REPO RATE</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#F59E0B">5.25%</text>
          <text x="85" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">maintained</text>
        </g>
        
        <g transform="translate(0, 522)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">GDP GROWTH</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#34D399">▲ 6.70%</text>
          <text x="110" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">FY27 proj</text>
        </g>

        <g transform="translate(0, 582)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.8">USD / INR</text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#38BDF8">95.66</text>
          <text x="85" y="26" font-family="-apple-system, sans-serif" font-weight="400" font-size="11" fill="#475569">spot rate</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Divider -->
  <line x1="320" y1="28" x2="320" y2="172" stroke="#1E293B" stroke-width="1"/>

  <!-- Right: Project info -->
  <g transform="translate(352, 28)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="362, 28" to="352, 28" dur="1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0; 1"/>
    
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#F1F5F9" letter-spacing="-0.5">VaticMacro</text>

    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">ML pipeline that forecasts Indian macroeconomic</text>
    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">indicators using gradient-boosted models with</text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">k-fold cross-validation.</text>

    <!-- Model info — real from the repo -->
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.8">BEST MODEL</text>
    <text x="110" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Ridge (K-fold CV)</text>

    <!-- Tech stack — plain text -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#475569">Python · XGBoost · scikit-learn · Flask · Docker</text>

    <!-- Source link -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#334155">github.com/DhanushPillay/VaticMacro</text>
  </g>

  <!-- Subtle live indicator -->
  <circle cx="810" cy="24" r="3" fill="#34D399" class="cpi-pulse" style="animation: cpiPulse 3s ease-in-out infinite"/>
</svg>
