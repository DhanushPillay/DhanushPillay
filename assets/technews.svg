<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Animated Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#06B6D4;#10B981" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#21262D" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #FFFFFF;
    }
    .badge-tag {
      font-family: "JetBrains Mono", "Fira Code", monospace, sans-serif;
      font-weight: 600;
      font-size: 10px;
      fill: #10B981;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      fill: #8B949E;
      line-height: 18px;
    }
    .chip {
      fill: #21262D;
      stroke: #30363D;
      stroke-width: 1;
      rx: 4;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 10.5px;
      fill: #C9D1D9;
    }
    .cta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #10B981;
    }
  </style>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="406" height="236" rx="12" fill="url(#borderGrad)" />
  <rect x="3" y="3" width="404" height="234" rx="11" fill="url(#bgGrad)" />

  <g transform="translate(20, 20)">
    <!-- Header Row: Icon + Title + Type Badge -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#1C2128" stroke="#30363D" stroke-width="1" />
    <!-- Newspaper / Stream Icon -->
    <rect x="8" y="10" width="20" height="16" rx="2" fill="none" stroke="#10B981" stroke-width="2" />
    <line x1="12" y1="15" x2="24" y2="15" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
    <line x1="12" y1="19" x2="20" y2="19" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />

    <text x="46" y="16" class="title">TechNews Engine</text>
    <rect x="46" y="22" width="138" height="16" rx="4" fill="#0C261E" stroke="#174E3E" stroke-width="0.8" />
    <text x="52" y="34" class="badge-tag">NLP STREAM AGGREGATOR</text>

    <!-- Description -->
    <text x="0" y="65" class="desc">
      <tspan x="0" dy="0">High-throughput news intelligence PWA streaming from 5+</tspan>
      <tspan x="0" dy="19">tech sources with concurrent asynchronous scrapers,</tspan>
      <tspan x="0" dy="19">automated deduplication, and VADER sentiment indexing.</tspan>
    </text>

    <!-- Tech Chips -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="58" height="22" class="chip" />
      <text x="8" y="15" class="chip-text">Python</text>

      <rect x="66" y="0" width="50" height="22" class="chip" />
      <text x="74" y="15" class="chip-text">Flask</text>

      <rect x="124" y="0" width="56" height="22" class="chip" />
      <text x="132" y="15" class="chip-text">SQLite</text>

      <rect x="188" y="0" width="50" height="22" class="chip" />
      <text x="196" y="15" class="chip-text">NLTK</text>

      <rect x="246" y="0" width="104" height="22" class="chip" />
      <text x="254" y="15" class="chip-text">BeautifulSoup4</text>
    </g>

    <!-- Footer Action -->
    <g transform="translate(0, 175)">
      <line x1="0" y1="0" x2="370" y2="0" stroke="#21262D" stroke-width="1" />
      <text x="0" y="18" class="cta-text">View Repository &amp; Architecture →</text>
    </g>
  </g>
</svg>
