<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 260" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="snBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#06090D" />
    </linearGradient>

    <linearGradient id="snBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Source Activity Stream Gradient -->
    <linearGradient id="sourceGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseFeed {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes ftsGlow {
      0%, 100% { stroke-dashoffset: 60; }
      50% { stroke-dashoffset: 0; }
    }
    .project-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
      font-weight: 700;
      font-size: 19px;
      fill: #FFFFFF;
      letter-spacing: -0.3px;
    }
    .project-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94A3B8;
      line-height: 17px;
    }
    .source-tag {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 9px;
      fill: #64748B;
    }
    .tag-chip {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      fill: #CBD5E1;
    }
    .active-stream {
      animation: pulseFeed 3s ease-in-out infinite;
    }
    .fts-line {
      stroke-dasharray: 8, 4;
      animation: ftsGlow 5s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .active-stream, .fts-line { animation: none; }
    }
  </style>

  <!-- Card Canvas -->
  <rect x="0" y="0" width="410" height="260" rx="14" fill="url(#snBg)" />
  <rect x="1" y="1" width="408" height="258" rx="13" fill="none" stroke="url(#snBorder)" stroke-width="1.2" />

  <!-- TOP HEADER -->
  <g transform="translate(22, 22)">
    <text x="0" y="18" class="project-title">Sniffer</text>
    <text x="0" y="40" class="project-desc">Concurrent tech news aggregator &amp; PWA with SQLite FTS5 search &amp; NLP indexing.</text>
  </g>

  <!-- CONCURRENT SCRAPING & FTS5 SEARCH PIPELINE -->
  <g transform="translate(22, 90)">
    <!-- Container -->
    <rect x="0" y="0" width="366" height="85" rx="8" fill="#101722" stroke="#1E293B" stroke-width="1" />

    <!-- 5 Live Sources Indicators -->
    <g transform="translate(14, 18)" class="active-stream">
      <circle cx="4" cy="4" r="3" fill="#10B981" />
      <text x="14" y="7" font-family="JetBrains Mono" font-size="9.5" fill="#34D399">5 CONCURRENT SOURCES // RSS-FIRST ENGINE</text>
    </g>

    <!-- Source Chips (HN, TechCrunch, Reddit, Verge, Ars) -->
    <g transform="translate(14, 34)">
      <text x="0" y="10" class="source-tag">HN</text>
      <circle cx="24" cy="7" r="1.5" fill="#475569" />
      <text x="32" y="10" class="source-tag">TECHCRUNCH</text>
      <circle cx="106" cy="7" r="1.5" fill="#475569" />
      <text x="114" y="10" class="source-tag">R/TECHNOLOGY</text>
      <circle cx="196" cy="7" r="1.5" fill="#475569" />
      <text x="204" y="10" class="source-tag">VERGE</text>
      <circle cx="244" cy="7" r="1.5" fill="#475569" />
      <text x="252" y="10" class="source-tag">ARS TECHNICA</text>
    </g>

    <!-- Architecture Badges: FTS5 + WAL Mode + VADER NLP -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="98" height="18" rx="4" fill="#162534" stroke="#253E57" stroke-width="0.8" />
      <text x="8" y="12" font-family="JetBrains Mono" font-size="8.5" fill="#38BDF8">SQLITE FTS5</text>

      <rect x="106" y="0" width="85" height="18" rx="4" fill="#0E2820" stroke="#1B4F3E" stroke-width="0.8" />
      <text x="114" y="12" font-family="JetBrains Mono" font-size="8.5" fill="#34D399">WAL CACHE</text>

      <rect x="199" y="0" width="138" height="18" rx="4" fill="#1C182A" stroke="#3D325C" stroke-width="0.8" />
      <text x="207" y="12" font-family="JetBrains Mono" font-size="8.5" fill="#A78BFA">VADER SENTIMENT</text>
    </g>
  </g>

  <!-- TECH CHIPS FOOTER -->
  <g transform="translate(22, 195)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="62" height="24" rx="6" fill="#15202E" stroke="#25374D" stroke-width="1" />
      <text x="10" y="16" class="tag-chip">Python</text>
    </g>

    <g transform="translate(70, 0)">
      <rect x="0" y="0" width="56" height="24" rx="6" fill="#15202E" stroke="#25374D" stroke-width="1" />
      <text x="10" y="16" class="tag-chip">Flask</text>
    </g>

    <g transform="translate(134, 0)">
      <rect x="0" y="0" width="82" height="24" rx="6" fill="#15202E" stroke="#25374D" stroke-width="1" />
      <text x="10" y="16" class="tag-chip">SQLite FTS</text>
    </g>

    <g transform="translate(224, 0)">
      <rect x="0" y="0" width="54" height="24" rx="6" fill="#15202E" stroke="#25374D" stroke-width="1" />
      <text x="10" y="16" class="tag-chip">NLTK</text>
    </g>

    <g transform="translate(286, 0)">
      <rect x="0" y="0" width="80" height="24" rx="6" fill="#15202E" stroke="#25374D" stroke-width="1" />
      <text x="10" y="16" class="tag-chip">PWA / RSS</text>
    </g>
  </g>

  <!-- ACTION LINK HINT -->
  <g transform="translate(22, 235)">
    <text x="0" y="12" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#10B981">View Repository &amp; Architecture →</text>
  </g>
</svg>
