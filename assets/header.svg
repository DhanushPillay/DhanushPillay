<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <!-- Seamless Canvas Background -->
    <linearGradient id="headerCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#070A0E" />
    </linearGradient>

    <!-- Flowing Wave Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="waveIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Ambient Backlight -->
    <radialGradient id="ambientLight" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes waveMove1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px) scaleY(1.08); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(50px) scaleY(0.92); }
      100% { transform: translateX(0px); }
    }
    @keyframes lineDraw {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .display-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.8px;
      fill: #FFFFFF;
    }
    .display-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94A3B8;
      letter-spacing: 0.2px;
    }
    .accent-bar {
      stroke-dasharray: 400;
      animation: lineDraw 2.5s ease-out forwards;
    }
    .wave-1 {
      animation: waveMove1 9s ease-in-out infinite;
      transform-origin: center;
    }
    .wave-2 {
      animation: waveMove2 12s ease-in-out infinite;
      transform-origin: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .wave-1, .wave-2, .accent-bar { animation: none; }
    }
  </style>

  <!-- Background Base -->
  <rect x="0" y="0" width="850" height="180" rx="12" fill="url(#headerCanvas)" />
  <rect x="0" y="0" width="850" height="180" rx="12" fill="url(#ambientLight)" />
  <rect x="1" y="1" width="848" height="178" rx="11" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- FLOWING KINETIC BACKGROUND WAVES -->
  <g opacity="0.85">
    <!-- Wave Layer 2 (Indigo Backdrop) -->
    <path class="wave-2" d="M -50 140 C 150 110, 300 170, 500 130 C 700 90, 800 160, 950 135" fill="none" stroke="url(#waveIndigo)" stroke-width="2.5" />

    <!-- Wave Layer 1 (Cyan/Mint Foreground) -->
    <path class="wave-1" d="M -50 150 C 120 120, 280 180, 480 140 C 680 100, 780 170, 950 145" fill="none" stroke="url(#waveCyan)" stroke-width="2" />
  </g>

  <!-- TYPOGRAPHIC CONTENT (Clean, Confident, Human) -->
  <g transform="translate(42, 58)">
    <!-- Name -->
    <text x="0" y="28" class="display-name">Dhanush Pillay</text>

    <!-- Dynamic Accent Horizon Line -->
    <line x1="0" y1="46" x2="380" y2="46" stroke="url(#waveCyan)" stroke-width="2" class="accent-bar" />

    <!-- Subtitle / Focus Areas -->
    <text x="0" y="76" class="display-sub">Cloud &amp; Big Data Engineering · Machine Learning Systems</text>
  </g>
</svg>
