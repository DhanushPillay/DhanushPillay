<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="snBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <!-- No CSS animation needed — using native SMIL for smooth rendering -->

  <!-- Canvas -->
  <rect width="850" height="200" rx="8" fill="url(#snBg)"/>
  <rect x="0.5" y="0.5" width="849" height="199" rx="8" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Left: Content -->
  <g>
    <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#F1F5F9" letter-spacing="-0.5">Sniffer</text>

    <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Tech news aggregator that scrapes 5 sources, ranks</text>
    <text x="32" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">by sentiment, and serves a searchable offline PWA.</text>

    <text x="32" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748B">CONCURRENT SCRAPING</text>
    <text x="195" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#475569">·</text>
    <text x="210" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748B">SQLite FTS5 SEARCH</text>
    <text x="370" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#475569">·</text>
    <text x="385" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748B">NLP SENTIMENT</text>

    <text x="32" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#475569">Python · Flask · SQLite · NLTK · PWA</text>

    <text x="32" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#334155">github.com/DhanushPillay/Web-scraper</text>
  </g>

  <!-- Right: Simulated live feed with seamless infinite scroll -->
  <g transform="translate(570, 24)">
    <rect x="0" y="0" width="248" height="72" rx="6" fill="#0F1318" stroke="#1E293B" stroke-width="1"/>

    <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#475569" letter-spacing="0.8">LIVE FEED</text>
    <line x1="12" y1="22" x2="236" y2="22" stroke="#1E293B" stroke-width="0.5"/>

    <!-- Clip window: shows ~2.5 items at a time -->
    <clipPath id="feedClip">
      <rect x="0" y="24" width="248" height="46"/>
    </clipPath>
    <g clip-path="url(#feedClip)">
      <!-- SMIL animateTransform: native, smooth, no CSS jank -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-108" dur="18s" repeatCount="indefinite"/>

        <!-- === SET 1 (6 items, 18px each) === -->
        <circle cx="20" cy="36" r="3" fill="#F97316"/>
        <text x="28" y="39" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">AI chip startup raises $400M</text>
        <text x="228" y="39" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">HN</text>

        <circle cx="20" cy="54" r="3" fill="#10B981"/>
        <text x="28" y="57" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">Linux 6.12 kernel released</text>
        <text x="228" y="57" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">TC</text>

        <circle cx="20" cy="72" r="3" fill="#3B82F6"/>
        <text x="28" y="75" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">RISC-V laptop hits 120 fps</text>
        <text x="228" y="75" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">r/</text>

        <circle cx="20" cy="90" r="3" fill="#A78BFA"/>
        <text x="28" y="93" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">Apple M5 production begins</text>
        <text x="228" y="93" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">VG</text>

        <circle cx="20" cy="108" r="3" fill="#EC4899"/>
        <text x="28" y="111" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">EU fines Meta over data misuse</text>
        <text x="228" y="111" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">Ars</text>

        <circle cx="20" cy="126" r="3" fill="#F97316"/>
        <text x="28" y="129" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">Show HN: SQLite vector search</text>
        <text x="228" y="129" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">HN</text>

        <!-- === SET 2 (exact duplicate, offset +108px) === -->
        <circle cx="20" cy="144" r="3" fill="#F97316"/>
        <text x="28" y="147" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">AI chip startup raises $400M</text>
        <text x="228" y="147" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">HN</text>

        <circle cx="20" cy="162" r="3" fill="#10B981"/>
        <text x="28" y="165" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">Linux 6.12 kernel released</text>
        <text x="228" y="165" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">TC</text>

        <circle cx="20" cy="180" r="3" fill="#3B82F6"/>
        <text x="28" y="183" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">RISC-V laptop hits 120 fps</text>
        <text x="228" y="183" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">r/</text>

        <circle cx="20" cy="198" r="3" fill="#A78BFA"/>
        <text x="28" y="201" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">Apple M5 production begins</text>
        <text x="228" y="201" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">VG</text>

        <circle cx="20" cy="216" r="3" fill="#EC4899"/>
        <text x="28" y="219" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">EU fines Meta over data misuse</text>
        <text x="228" y="219" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">Ars</text>

        <circle cx="20" cy="234" r="3" fill="#F97316"/>
        <text x="28" y="237" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#CBD5E1">Show HN: SQLite vector search</text>
        <text x="228" y="237" font-family="-apple-system, sans-serif" font-weight="400" font-size="9" fill="#475569">HN</text>
      </g>
    </g>
  </g>

  <!-- Right: Source indicators — the 5 real sources -->
  <g transform="translate(570, 110)">
    <circle cx="8" cy="8" r="4" fill="#F97316" opacity="0.7"/>
    <text x="18" y="12" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748B">Hacker News</text>

    <circle cx="118" cy="8" r="4" fill="#10B981" opacity="0.7"/>
    <text x="128" y="12" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748B">TechCrunch</text>

    <circle cx="8" cy="28" r="4" fill="#3B82F6" opacity="0.7"/>
    <text x="18" y="32" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748B">r/technology</text>

    <circle cx="118" cy="28" r="4" fill="#A78BFA" opacity="0.7"/>
    <text x="128" y="32" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748B">The Verge</text>

    <circle cx="8" cy="48" r="4" fill="#EC4899" opacity="0.7"/>
    <text x="18" y="52" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748B">Ars Technica</text>
  </g>
</svg>
