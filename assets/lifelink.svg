<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="llCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#06090D" />
    </linearGradient>

    <!-- Subtle Ambient Rose/Indigo Glow -->
    <radialGradient id="llGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </radialGradient>

    <!-- Smooth Border Gradient -->
    <linearGradient id="llBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#F43F5E;#818CF8;#FB7185;#F43F5E" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Route Line Gradient -->
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <style>
    @keyframes netPulse {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.4px;
      fill: #FFFFFF;
    }
    .proj-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 13px;
      fill: #94A3B8;
      line-height: 18px;
    }
    .proj-bullet {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 11.5px;
      fill: #CBD5E1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      fill: #E2E8F0;
    }
    .diag-label {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-weight: 600;
      font-size: 9px;
      letter-spacing: 0.3px;
      fill: #94A3B8;
    }
    .diag-value {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-weight: 700;
      font-size: 10px;
      fill: #F43F5E;
    }
    .net-line {
      stroke-dasharray: 6, 4;
      animation: netPulse 3.5s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .net-line, #llBorderGrad animate { animation: none; }
    }
  </style>

  <!-- Card Base Canvas (850x180 Full-Width Responsive) -->
  <rect x="0" y="0" width="850" height="180" rx="14" fill="url(#llCardBg)" />
  <rect x="0" y="0" width="850" height="180" rx="14" fill="url(#llGlow)" />
  <rect x="1" y="1" width="848" height="178" rx="13" fill="none" stroke="url(#llBorderGrad)" stroke-width="1.2" />

  <!-- LEFT COLUMN: Project Details & Context -->
  <g transform="translate(32, 28)">
    <!-- Title & Domain -->
    <text x="0" y="18" class="proj-title">LifeLink <tspan font-weight="500" font-size="14" fill="#F43F5E">· Real-Time Donor Matching Network</tspan></text>
    <text x="0" y="42" class="proj-sub">Full-stack platform connecting organ and blood donors with critical care patients.</text>

    <!-- Key Engineering Bullets -->
    <g transform="translate(0, 64)">
      <circle cx="4" cy="4" r="2" fill="#F43F5E" />
      <text x="14" y="8" class="proj-bullet">Real-time matching engine with geospatial radius indexing for emergency hospital requests</text>

      <circle cx="4" cy="24" r="2" fill="#818CF8" />
      <text x="14" y="28" class="proj-bullet">Role-based access control (RBAC) and verified credentials for medical hubs and donors</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 114)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="58" height="22" rx="6" fill="#141E2B" stroke="#253549" stroke-width="1" />
        <text x="10" y="15" class="badge-text">React</text>
      </g>
      <g transform="translate(66, 0)">
        <rect x="0" y="0" width="48" height="22" rx="6" fill="#141E2B" stroke="#253549" stroke-width="1" />
        <text x="10" y="15" class="badge-text">Vite</text>
      </g>
      <g transform="translate(122, 0)">
        <rect x="0" y="0" width="68" height="22" rx="6" fill="#141E2B" stroke="#253549" stroke-width="1" />
        <text x="10" y="15" class="badge-text">Node.js</text>
      </g>
      <g transform="translate(198, 0)">
        <rect x="0" y="0" width="76" height="22" rx="6" fill="#141E2B" stroke="#253549" stroke-width="1" />
        <text x="10" y="15" class="badge-text">MongoDB</text>
      </g>
      <g transform="translate(282, 0)">
        <rect x="0" y="0" width="72" height="22" rx="6" fill="#141E2B" stroke="#253549" stroke-width="1" />
        <text x="10" y="15" class="badge-text">Express</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Matching Network Routing Schematic -->
  <g transform="translate(560, 24)">
    <rect x="0" y="0" width="258" height="132" rx="10" fill="#0E141D" stroke="#1E293B" stroke-width="1" />

    <!-- Node Network Visual -->
    <g transform="translate(16, 16)">
      <!-- Connected Route Lines -->
      <line x1="30" y1="26" x2="110" y2="15" stroke="url(#routeGrad)" stroke-width="1.6" class="net-line" />
      <line x1="110" y1="15" x2="190" y2="35" stroke="url(#routeGrad)" stroke-width="1.6" class="net-line" />

      <!-- Patient Node -->
      <circle cx="30" cy="26" r="5" fill="#38BDF8" />
      <text x="30" y="44" text-anchor="middle" font-family="JetBrains Mono" font-size="7.5" fill="#94A3B8">PATIENT</text>

      <!-- Hospital Coordination Hub -->
      <circle cx="110" cy="15" r="7" fill="#F43F5E" />
      <text x="110" y="-3" text-anchor="middle" font-family="JetBrains Mono" font-size="7.5" fill="#F43F5E">HOSPITAL HUB</text>

      <!-- Donor Node -->
      <circle cx="190" cy="35" r="5" fill="#34D399" />
      <text x="190" y="52" text-anchor="middle" font-family="JetBrains Mono" font-size="7.5" fill="#34D399">DONOR (VERIFIED)</text>
    </g>

    <!-- Key Metrics Telemetry -->
    <g transform="translate(16, 68)">
      <rect x="0" y="0" width="226" height="48" rx="6" fill="#131B26" stroke="#202D3D" stroke-width="1" />
      
      <text x="12" y="20" class="diag-label">MATCH ENGINE: <tspan class="diag-value">GEOSPATIAL</tspan></text>
      <text x="120" y="20" class="diag-label">LATENCY: <tspan class="diag-value">REAL-TIME</tspan></text>
      <text x="12" y="38" class="diag-label">AUTH PROTOCOL: <tspan class="diag-value">RBAC / JWT</tspan></text>
      <text x="120" y="38" class="diag-label">DATABASE: <tspan class="diag-value">MONGODB</tspan></text>
    </g>
  </g>
</svg>
