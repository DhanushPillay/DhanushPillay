<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="llBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes matchBlink {
      0%, 100% { fill: #1E293B; }
      50% { fill: #10B981; }
    }
    @media (prefers-reduced-motion: reduce) {
      .match-cell { animation: none !important; fill: #10B981; }
    }
  </style>

  <!-- Canvas -->
  <rect width="850" height="200" rx="8" fill="url(#llBg)"/>
  <rect x="0.5" y="0.5" width="849" height="199" rx="8" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Top: Project info — full-width, not split -->
  <g>
    <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#F1F5F9" letter-spacing="-0.5">LifeLink</text>
    <text x="120" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#475569">blood-and-organ-donar-matching-syst.vercel.app</text>

    <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Full-stack platform connecting organ and blood donors with patients in real time.</text>
    <text x="32" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94A3B8">Rare blood group support, geolocation search, hospital portal, and verified donor matching.</text>
  </g>

  <!-- Bottom left: Compatibility matrix — like a real matching grid -->
  <g transform="translate(32, 104)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="0.8">BLOOD GROUP MATCHING</text>

    <!-- Column headers -->
    <text x="130" y="32" font-family="-apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="middle">A+</text>
    <text x="160" y="32" font-family="-apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="middle">B+</text>
    <text x="190" y="32" font-family="-apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="middle">AB+</text>
    <text x="220" y="32" font-family="-apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="middle">O+</text>
    <text x="250" y="32" font-family="-apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="middle">O−</text>

    <!-- Row: Donor A+ -->
    <text x="0" y="48" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#94A3B8">Donor A+</text>
    <rect x="122" y="38" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="152" y="38" width="16" height="12" rx="2" fill="#1E293B"/>
    <rect x="182" y="38" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="212" y="38" width="16" height="12" rx="2" fill="#1E293B"/>
    <rect x="242" y="38" width="16" height="12" rx="2" fill="#1E293B"/>

    <!-- Row: Donor O− (universal) -->
    <text x="0" y="66" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#94A3B8">Donor O−</text>
    <rect x="122" y="56" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="152" y="56" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="182" y="56" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="212" y="56" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="242" y="56" width="16" height="12" rx="2" fill="#10B981" opacity="0.8" class="match-cell" style="animation: matchBlink 3s ease-in-out infinite"/>

    <!-- Row: Donor B+ -->
    <text x="0" y="84" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#94A3B8">Donor B+</text>
    <rect x="122" y="74" width="16" height="12" rx="2" fill="#1E293B"/>
    <rect x="152" y="74" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="182" y="74" width="16" height="12" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="212" y="74" width="16" height="12" rx="2" fill="#1E293B"/>
    <rect x="242" y="74" width="16" height="12" rx="2" fill="#1E293B"/>
  </g>

  <!-- Bottom right: Key features + tech stack -->
  <g transform="translate(460, 104)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="0.8">KEY FEATURES</text>
    <text x="0" y="32" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#94A3B8">Real-time donor matching</text>
    <text x="0" y="48" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#94A3B8">Location-based search via Google Maps</text>
    <text x="0" y="64" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#94A3B8">Hospital portal with JWT auth</text>

    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#475569">React · Node.js · MongoDB · Express · Google Maps</text>
  </g>
</svg>
